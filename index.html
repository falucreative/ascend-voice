<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talk to Syd</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 20px;
         display: flex; flex-direction: column; align-items: center; gap: 14px;
         background: #101418; color: #e8edf2; min-height: 100vh; box-sizing: border-box; }
  h1 { font-size: 19px; margin: 4px 0 0; }
  #status { font-size: 14px; color: #9fb0c0; text-align: center; min-height: 36px;
            max-width: 340px; word-break: break-word; }
  #chan { font-size: 12px; color: #6d7f90; }
  button { font-size: 17px; padding: 13px 26px; border-radius: 999px; border: none;
           background: #2f6fed; color: #fff; }
  button:disabled { opacity: .35; }
  #rec.live { background: #d64545; }
  #out { width: 100%; max-width: 420px; min-height: 130px; background: #1a2027;
         border-radius: 10px; padding: 12px; font-size: 16px; line-height: 1.45;
         box-sizing: border-box; white-space: pre-wrap; }
  #out .part { color: #8fa3b8; }
  .row { display: flex; gap: 10px; }
</style>
</head>
<body>
<h1>Talk to Syd</h1>
<p id="chan">channel: checking&#8230;</p>
<p id="status">Tap Record and speak. Your words appear below as you talk.</p>
<button id="rec" type="button">&#127908; Record</button>
<div id="out"></div>
<audio id="play" controls class="hidden" style="width:100%;max-width:420px;display:none"></audio>
<div class="row">
  <button id="send" type="button" disabled>Done &#8212; send to Syd</button>
  <button id="copy" type="button" disabled>Copy</button>
</div>
<script>
(function () {
  'use strict';
  var st = document.getElementById('status');
  var chanEl = document.getElementById('chan');
  var btn = document.getElementById('rec');
  var out = document.getElementById('out');
  var sendBtn = document.getElementById('send');
  var copyBtn = document.getElementById('copy');
  function say(s) { st.textContent = s; }
  function fail(where, e) { say('FAILED at ' + where + ': ' + (e && e.message ? e.message : e)); }

  // fragment: w=<presigned wss> & o=<app origin> & t=1 (tone smoke), all URI-encoded
  var frag = {};
  location.hash.slice(1).split('&').forEach(function (kv) {
    var i = kv.indexOf('=');
    if (i > 0) frag[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });
  var WSS = frag.w || '';
  var APP_ORIGIN = frag.o || '';
  var TONE = frag.t === '1';
  // card 275 (2026-09-07): m=sig — VOICE SIGNATURE mode. The page ALSO records the audio it streams
  // (MediaRecorder) and hands BOTH the transcript and the clip back to the app. The clip never rests
  // here: it lives in memory for the length of the popup, then goes to the app, then to Drive.
  var SIG = frag.m === 'sig';
  var NONCE = String(frag.n || '');   // minted by the app per tap; the handback must carry it
  var SIG_MAX_MS = 60000, sigRec = null, sigChunks = [], sigMime = '', sigStartedAt = 0, sigStopTimer = null;
  var sigPcm = [], sigPcmLen = 0, sigRecState = 'none';   // the 16 kHz PCM already streamed doubles as the clip source
  if (SIG) {
    document.title = 'Voice signature';
    document.querySelector('h1').textContent = 'Voice signature';
    st.textContent = 'Hand the phone to the patient. Tap Record, they say their name and that they agree to today\u2019s visit, then tap Stop. 60 seconds max.';
    sendBtn.textContent = 'Done \u2014 save to the note';
  }
  var originOk = /^https:\/\//.test(APP_ORIGIN) &&
    (/\.googleusercontent\.com$/.test(new URL(APP_ORIGIN || 'https://x.invalid').host) ||
     APP_ORIGIN === 'https://script.google.com');
  // NOTE (card 230): this allowlist is NOT an app-identity control — any Apps
  // Script origin passes. The app-side event.origin check is the real gate.
  var channel = (window.opener != null) && originOk;
  chanEl.textContent = 'channel: ' + (channel ? 'connected' : 'copy-only');

  var finals = [];   // finalized transcript pieces
  var partial = '';  // current partial
  function render() {
    out.textContent = finals.join(' ');
    if (partial) {
      var sp = document.createElement('span');
      sp.className = 'part';
      sp.textContent = (finals.length ? ' ' : '') + partial;
      out.appendChild(sp);
    }
    var has = finals.length > 0 || partial;
    copyBtn.disabled = !has;
  }

  // ---------- CRC32 (IEEE) ----------
  var CRC_T = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes, start, end) {
    var c = 0xFFFFFFFF;
    for (var i = start; i < end; i++) c = CRC_T[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  // ---------- eventstream encode ----------
  var TE = new TextEncoder();
  function esHeader(name, value) {
    var nb = TE.encode(name), vb = TE.encode(value);
    var buf = new Uint8Array(1 + nb.length + 1 + 2 + vb.length);
    var o = 0;
    buf[o++] = nb.length; buf.set(nb, o); o += nb.length;
    buf[o++] = 7; // type: string
    buf[o++] = (vb.length >> 8) & 0xFF; buf[o++] = vb.length & 0xFF;
    buf.set(vb, o);
    return buf;
  }
  function esFrame(headers, payload) {
    var hlen = headers.reduce(function (a, h) { return a + h.length; }, 0);
    var total = 12 + hlen + payload.length + 4;
    var buf = new Uint8Array(total);
    var dv = new DataView(buf.buffer);
    dv.setUint32(0, total); dv.setUint32(4, hlen);
    dv.setUint32(8, crc32(buf, 0, 8));
    var o = 12;
    headers.forEach(function (h) { buf.set(h, o); o += h.length; });
    buf.set(payload, o); o += payload.length;
    dv.setUint32(o, crc32(buf, 0, o));
    return buf;
  }
  function audioEvent(pcmBytes) {
    return esFrame([
      esHeader(':message-type', 'event'),
      esHeader(':event-type', 'AudioEvent'),
      esHeader(':content-type', 'application/octet-stream')
    ], pcmBytes);
  }

  // ---------- eventstream decode ----------
  function esParse(buf) {
    var u8 = new Uint8Array(buf), dv = new DataView(buf);
    var hlen = dv.getUint32(4);
    var headers = {}, o = 12, hend = 12 + hlen;
    while (o < hend) {
      var nl = u8[o++]; var name = new TextDecoder().decode(u8.subarray(o, o + nl)); o += nl;
      var type = u8[o++];
      if (type === 7) {
        var vl = (u8[o] << 8) | u8[o + 1]; o += 2;
        headers[name] = new TextDecoder().decode(u8.subarray(o, o + vl)); o += vl;
      } else { break; } // only string headers expected from Transcribe
    }
    var payload = u8.subarray(hend, u8.length - 4);
    return { headers: headers, payload: payload };
  }

  // ---------- resampler: actual rate -> 16k, fractional linear interpolation ----------
  function resampleTo16k(f32, srcRate) {
    var ratio = srcRate / 16000;
    var n = Math.floor(f32.length / ratio);
    var pcm = new Int16Array(n);
    for (var i = 0; i < n; i++) {
      var pos = i * ratio, i0 = Math.floor(pos), i1 = Math.min(i0 + 1, f32.length - 1);
      var s = f32[i0] + (f32[i1] - f32[i0]) * (pos - i0);
      var v = Math.round(s * 32767);
      pcm[i] = Math.max(-32768, Math.min(32767, v));
    }
    return pcm;
  }

  var ws = null, ctx = null, proc = null, stream = null, running = false;
  var framesSent = 0, finalized = false, wsOpened = false;

  function wsUrlOk() { return /^wss:\/\/transcribestreaming\./.test(WSS); }

  function handleMessage(ev) {
    var msg;
    try { msg = esParse(ev.data); } catch (e) { fail('eventstream parse', e); return; }
    var mt = msg.headers[':message-type'];
    if (mt === 'exception') {
      var detail = '';
      try { detail = JSON.parse(new TextDecoder().decode(msg.payload)).Message || ''; } catch (e1) {}
      if (SIG) {
        // Voice signature (2026-09-07, Falú's phone): a transcription rejection must NEVER stop
        // the clip. Drop the socket, keep recording, say so in the channel line.
        chanEl.textContent = 'channel: connected \u00b7 transcription unavailable (' + String(msg.headers[':exception-type'] || 'exception').slice(0, 40) + (detail ? ': ' + detail.slice(0, 140) : '') + ') \u00b7 ' + framesSent + ' frame(s) sent \u2014 clip still recording';
        try { ws.close(); } catch (e9) {}
        ws = null;
        return;
      }
      fail('Transcribe ' + (msg.headers[':exception-type'] || 'exception'), detail.slice(0, 160));
      stopAll(false);
      return;
    }
    if (msg.headers[':event-type'] !== 'TranscriptEvent') return;
    var j;
    try { j = JSON.parse(new TextDecoder().decode(msg.payload)); } catch (e2) { return; }
    var results = (j.Transcript && j.Transcript.Results) || [];
    results.forEach(function (r) {
      var alt = r.Alternatives && r.Alternatives[0];
      if (!alt) return;
      if (r.IsPartial) { partial = alt.Transcript || ''; }
      else { if (alt.Transcript) finals.push(alt.Transcript); partial = ''; }
    });
    render();
  }

  function stopAll(sendEmpty) {
    running = false;
    if (SIG) sigStop();
    btn.classList.remove('live'); btn.textContent = '🎤 Record';
    try { if (proc) proc.disconnect(); } catch (e) {}
    try { if (ctx) ctx.close(); } catch (e) {}
    if (stream) { stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} }); stream = null; }
    if (SIG && (!ws || ws.readyState !== 1)) {
      if (sigBlob()) { say('Recorded (no words were recognised). Play it back below, then save.'); sendBtn.disabled = !channel; setTimeout(sigOfferPlayback, 300); }
    }
    if (ws && ws.readyState === 1) {
      if (sendEmpty && !finalized) {
        finalized = true;
        try { ws.send(audioEvent(new Uint8Array(0))); } catch (e) {} // finalize flush
        say('Finishing up…');
        // Done enables when the final TranscriptEvent lands or the socket closes
        setTimeout(function () { try { ws.close(); } catch (e) {} }, 2500);
      } else { try { ws.close(); } catch (e) {} }
    }
  }

  function startTonePump() {
    // #t=1 smoke: 1.5s of 440Hz + 1.5s silence at 16k, 4096-sample frames.
    var total = 48000, sent = 0;
    var timer = setInterval(function () {
      if (!ws || ws.readyState !== 1 || sent >= total) {
        clearInterval(timer);
        stopAll(true);
        return;
      }
      var n = Math.min(4096, total - sent);
      var pcm = new Int16Array(n);
      for (var i = 0; i < n; i++) {
        var t = (sent + i) / 16000;
        pcm[i] = (sent + i < 24000) ? Math.round(Math.sin(2 * Math.PI * 440 * t) * 12000) : 0;
      }
      sent += n;
      ws.send(audioEvent(new Uint8Array(pcm.buffer)));
      framesSent++;
      say('tone frames sent: ' + framesSent);
    }, 250);
  }

  // ---------- card 275: the clip ----------
  function sigStart(ms) {
    sigChunks = []; sigMime = ''; sigPcm = []; sigPcmLen = 0; sigStartedAt = Date.now();
    if (!window.MediaRecorder) { sigRecState = 'no-mediarecorder'; chanEl.textContent = 'channel: connected \u00b7 clip: from stream'; sigStopTimer = setTimeout(function () { say('60 seconds reached \u2014 stopping.'); stopAll(true); }, SIG_MAX_MS); return; }
    var prefs = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
    var mime = '';
    for (var i = 0; i < prefs.length; i++) { if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(prefs[i])) { mime = prefs[i]; break; } }
    try {
      sigRec = mime ? new MediaRecorder(ms, { mimeType: mime }) : new MediaRecorder(ms);
      sigMime = (sigRec.mimeType || mime || 'audio/mp4').split(';')[0];
      sigRec.ondataavailable = function (e) { if (e.data && e.data.size) sigChunks.push(e.data); chanEl.textContent = 'channel: connected \u00b7 clip: ' + sigMime + ' \u00b7 ' + sigChunks.length + ' chunk(s)'; };
      sigRec.onstop = function () { sigRecState = 'stopped'; sigOfferPlayback(); if (sigPendingDone) { sigPendingDone = false; sigFinish(); } };
      sigRec.start(1000);
      sigMime = String(sigRec.mimeType || mime || sigMime || 'audio/mp4').split(';')[0];   // Safari fills mimeType only after start()
      sigRecState = 'recording';
      sigStopTimer = setTimeout(function () { say('60 seconds reached \u2014 stopping.'); stopAll(true); }, SIG_MAX_MS);
    } catch (e) { sigRecState = 'error'; chanEl.textContent = 'channel: connected \u00b7 clip: from stream (recorder unavailable)'; }
  }
  function sigStop() {
    if (sigStopTimer) { clearTimeout(sigStopTimer); sigStopTimer = null; }
    try { if (sigRec && sigRec.state !== 'inactive') sigRec.stop(); } catch (e) {}
  }
  var sigSynthetic = null;
  function sigStartSynthetic() {
    // #t=1 in sig mode: a 1.5 s 440 Hz WAV, so the app-side upload/chip/notes path can be proven
    // on a simulator with no microphone. Never used on a real phone.
    var n = 24000, buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
    function w(o, sstr) { for (var i = 0; i < sstr.length; i++) dv.setUint8(o + i, sstr.charCodeAt(i)); }
    w(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); dv.setUint32(16, 16, true);
    dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, 16000, true); dv.setUint32(28, 32000, true);
    dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, n * 2, true);
    for (var i = 0; i < n; i++) dv.setInt16(44 + i * 2, Math.round(Math.sin(2 * Math.PI * 440 * i / 16000) * 12000), true);
    sigSynthetic = new Blob([buf], { type: 'audio/wav' }); sigMime = 'audio/wav'; sigStartedAt = Date.now();
  }
  function pcmToWav() {
    if (!sigPcmLen) return null;
    var n = sigPcmLen, buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf), o = 44;
    function w(off, sstr) { for (var i = 0; i < sstr.length; i++) dv.setUint8(off + i, sstr.charCodeAt(i)); }
    w(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); dv.setUint32(16, 16, true);
    dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, 16000, true); dv.setUint32(28, 32000, true);
    dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, n * 2, true);
    sigPcm.forEach(function (part) { for (var i = 0; i < part.length; i++) { dv.setInt16(o, part[i], true); o += 2; } });
    return new Blob([buf], { type: 'audio/wav' });
  }
  function sigBlob() {
    if (sigSynthetic) return sigSynthetic;
    if (sigChunks.length) return new Blob(sigChunks, { type: sigMime || 'audio/mp4' });
    return pcmToWav();   // no MediaRecorder, or it delivered nothing: the streamed PCM is the clip
  }
  function sigOfferPlayback() {
    var b = sigBlob(); if (!b) return;
    var a = document.getElementById('play');
    try { a.src = URL.createObjectURL(b); a.style.display = 'block'; } catch (e) {}
  }
  var sigPendingDone = false;
  function sigFinish() {
    var text = finals.join(' ').trim();
    var blob = sigBlob();
    if (!blob) { say('No recording captured \u2014 tap Record, speak, then Stop, and try again.'); return; }
    if (blob.size > 2 * 1024 * 1024) { say('That recording is too large to save. Try a shorter one.'); return; }
    var secs = Math.max(1, Math.round((Date.now() - sigStartedAt) / 1000));
    var fr = new FileReader();
    fr.onload = function () {
      var b64 = String(fr.result).split(',')[1] || '';
      if (channel && window.opener) {
        try {
          window.opener.postMessage({ ascendVoice: 'signature', nonce: NONCE, text: text, audio: b64, mime: blob.type || sigMime || 'audio/wav', seconds: Math.min(secs, 60) }, APP_ORIGIN);
          say('Saved to the note.');
          setTimeout(function () { try { window.close(); } catch (e) {} }, 400);
          return;
        } catch (e) {}
      }
      say('No channel back to the app \u2014 close this and try again from the note.');
    };
    fr.readAsDataURL(blob);
  }
  function beginSig() {
    // Voice signature: the MICROPHONE comes first and the socket is best-effort. If Transcribe is
    // down or the presign is stale, the clip still records (as a WAV from the PCM) and saves with
    // "no words were recognised".
    say('Asking for the microphone\u2026');
    // iOS Safari: an AudioContext made OUTSIDE the tap (inside the getUserMedia promise) stays
    // suspended and onaudioprocess never fires \u2014 0 frames reach Transcribe, AWS drops the
    // stream after 15 s of silence (BadRequestException, measured 2026-09-07). Create + resume it
    // HERE, synchronously inside the tap, and only then ask for the microphone.
    try {
      var AC0 = window.AudioContext || window.webkitAudioContext;
      ctx = new AC0();
      if (ctx.state === 'suspended') { try { ctx.resume(); } catch (eR) {} }
    } catch (eC) { ctx = null; }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (ms) {
      stream = ms;
      try {
        if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); }
        if (ctx.state === 'suspended') { try { ctx.resume(); } catch (eR2) {} }
        var src = ctx.createMediaStreamSource(ms);
        proc = ctx.createScriptProcessor(4096, 1, 1);
        proc.onaudioprocess = function (ev2) {
          if (!running) return;
          var pcm = resampleTo16k(ev2.inputBuffer.getChannelData(0), ctx.sampleRate);
          if (sigPcmLen < 16000 * 60) { sigPcm.push(pcm); sigPcmLen += pcm.length; }
          if (ws && ws.readyState === 1) { ws.send(audioEvent(new Uint8Array(pcm.buffer))); framesSent++; }
        };
        src.connect(proc); proc.connect(ctx.destination);
        sigStart(ms);
        running = true;
        btn.classList.add('live'); btn.textContent = '\u23f9 Stop';
        say('Recording \u2014 the patient says their name and that they agree to today\u2019s visit, then tap Stop.');
      } catch (e) { fail('audio pipeline', e); stopAll(false); return; }
      if (!wsUrlOk()) { chanEl.textContent = 'channel: connected \u00b7 no transcription session'; return; }
      try {
        ws = new WebSocket(WSS);
        ws.binaryType = 'arraybuffer';
        ws.onopen = function () { wsOpened = true; };
        ws.onmessage = handleMessage;
        ws.onerror = function () { chanEl.textContent = 'channel: connected \u00b7 transcription unavailable (clip still recording)'; };
        ws.onclose = function () {
          if (partial) { finals.push(partial); partial = ''; render(); }
          if (running) return;   // closed early: keep recording the clip
          say(finals.length ? 'Done. Review the words below, then tap Done to save.' : 'Recorded (no words were recognised). You can still save the clip.');
          sendBtn.disabled = !channel;
          copyBtn.disabled = !finals.length;
        };
      } catch (e) { ws = null; chanEl.textContent = 'channel: connected \u00b7 transcription unavailable (clip still recording)'; }
    }).catch(function (e) {
      fail('getUserMedia', e);
      say(st.textContent + ' \u2014 If you tapped Don\u2019t Allow: Safari aA menu \u2192 Website Settings \u2192 Microphone \u2192 Allow, then reload.');
      stopAll(false);
    });
  }
  function begin() {
    if (SIG && !TONE) { beginSig(); return; }
    if (!wsUrlOk()) { say(SIG ? 'No valid session in the link \u2014 open this from the Voice signature button in the note.' : 'No valid session in the link — open this from Syd’s mic button.'); return; }
    say(TONE ? 'Tone smoke starting…' : 'Asking for the microphone…');
    ws = new WebSocket(WSS);
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () {
      wsOpened = true;
      say(TONE ? 'Connected — streaming tone.' : 'Connected — speak now.');
      if (TONE) { if (SIG) sigStartSynthetic(); startTonePump(); return; }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (ms) {
        stream = ms;
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          ctx = new AC();
          if (ctx.state === 'suspended') ctx.resume();
          var src = ctx.createMediaStreamSource(ms);
          proc = ctx.createScriptProcessor(4096, 1, 1);
          proc.onaudioprocess = function (ev2) {
            if (!running || !ws || ws.readyState !== 1) return;
            var pcm = resampleTo16k(ev2.inputBuffer.getChannelData(0), ctx.sampleRate);
            if (SIG && sigPcmLen < 16000 * 60) { sigPcm.push(pcm); sigPcmLen += pcm.length; }
            ws.send(audioEvent(new Uint8Array(pcm.buffer)));
            framesSent++;
          };
          src.connect(proc); proc.connect(ctx.destination);
          if (SIG) sigStart(ms);
          running = true;
          btn.classList.add('live'); btn.textContent = '⏹ Stop';
          say('Recording — speak, then tap Stop.');
        } catch (e) { fail('audio pipeline', e); stopAll(false); }
      }).catch(function (e) {
        fail('getUserMedia', e);
        say(st.textContent + ' — If you tapped Don’t Allow: Safari aA menu → Website Settings → Microphone → Allow, then reload.');
        stopAll(false);
      });
    };
    ws.onmessage = handleMessage;
    ws.onerror = function () { if (!wsOpened) say(SIG ? 'Could not reach the transcription service \u2014 the clip is still being recorded; tap Stop when done.' : 'Could not connect (the session may have expired — reopen from Syd).'); };
    ws.onclose = function (ev3) {
      if (running) { running = false; btn.classList.remove('live'); btn.textContent = '🎤 Record'; }
      if (finals.length || partial) {
        if (partial) { finals.push(partial); partial = ''; render(); }
        say('Done. Review below, then send or copy.');
        sendBtn.disabled = !channel;
        copyBtn.disabled = false;
      } else if (SIG && sigBlob()) {
        say('Recorded (no words were recognised). Play it back below, then save.');
        sendBtn.disabled = !channel; setTimeout(sigOfferPlayback, 300);
      } else if (wsOpened && TONE) {
        say('Tone smoke complete: opened, ' + framesSent + ' frames sent, clean close ' + ev3.code + '.');
      } else if (wsOpened) {
        say('Closed (' + ev3.code + ') with no transcript — try again.');
      }
    };
  }

  btn.addEventListener('click', function () {
    if (running) { stopAll(true); sendBtn.disabled = !channel && true; return; }
    finals = []; partial = ''; framesSent = 0; finalized = false; wsOpened = false;
    render(); sendBtn.disabled = true; copyBtn.disabled = true;
    begin();
  });

  sendBtn.addEventListener('click', function () {
    var text = finals.join(' ').trim();
    if (SIG) {
      if (sigRec && sigRec.state !== 'inactive') { sigPendingDone = true; say('Finishing the recording\u2026'); try { sigRec.stop(); } catch (e) { sigPendingDone = false; sigFinish(); } return; }
      sigFinish();
      return;
    }
    if (!text) return;
    if (channel && window.opener) {
      try {
        window.opener.postMessage({ ascendVoice: 'transcript', text: text }, APP_ORIGIN);
        say('Sent to Syd.');
        setTimeout(function () { try { window.close(); } catch (e) {} }, 400);
        return;
      } catch (e) { /* fall through to copy advice */ }
    }
    say('No channel — use Copy, then paste into Syd.');
  });

  copyBtn.addEventListener('click', function () {
    var text = (finals.join(' ') + (partial ? ' ' + partial : '')).trim();
    if (!text) return;
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); say('Copied — paste it into Syd.'); }
      catch (e) { say('Copy failed — select the text above by hand.'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { say('Copied — paste it into Syd.'); }, fallback);
    } else { fallback(); }
  });
})();
</script>
</body>
</html>
